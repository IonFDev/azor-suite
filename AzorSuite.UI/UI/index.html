<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Azor Suite</title>
</head>
<body>

    <h1>Azor Suite</h1>

    <form id="loginForm">

               placeholder="Usuario"

            Iniciar sesión

    <p id="result"></p>

    <script src="js/app.js"></script>

</body>
</html>
