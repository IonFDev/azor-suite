<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azor Suite | Iniciar sesión</title>

    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/auth/app.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-brand">
            <h1>Azor <span>Suite</span></h1>
            <p>Herramientas y automatización para Inventor</p>
        </div>

        <section class="auth-card">

            <h2>Iniciar sesión</h2>

            <p class="auth-description">
                Accede a tu cuenta para continuar.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Usuario
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Introduce tu usuario"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Introduce tu contraseña"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit"
                        class="auth-button">
                    Iniciar sesión
                </button>

            </form>

            <p id="result"></p>

        </section>

    </main>

    <script src="../../js/auth/app.js"></script>

</body>
</html>
